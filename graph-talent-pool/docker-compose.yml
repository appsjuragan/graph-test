version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: talent-pool-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/talentpool123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data:/import
    networks:
      - talent-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  talent-network:
    driver: bridge
